[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supaero-calsync"
version = "0.1.0"
description = "Sync your ISAE-SUPAERO timetable (Auriga portal) to Google Calendar, with colour-coded priority classes and zero duplicates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Milhane Bekkaye" }]
dependencies = [
    "certifi",
    "truststore>=0.9",
    "playwright>=1.45",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
supaero-calsync = "calsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
calsync = ["default_config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# An explicit rule set, so CI does not break whenever ruff changes its defaults.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length is a formatting matter, not a bug
